mcp_servers:
  antfly:
    url: "${ANTFLY_MCP_URL}"
    headers:
      Authorization: "Bearer ${ANTFLY_API_KEY}"
    enabled: true
    connect_timeout: 20
    timeout: 25
    supports_parallel_tool_calls: false
    tools:
      include:
        - query
        - get_document
      resources: false
      prompts: false
